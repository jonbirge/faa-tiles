<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@__CESIUM__/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@__CESIUM__/Build/Cesium/Cesium.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #cesiumContainer { width: 100%; height: 100%; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #e8e8e8; background: rgba(20, 22, 26, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 6px;
    padding: 10px 12px; width: 318px; backdrop-filter: blur(6px);
    max-height: calc(100vh - 40px); overflow-y: auto;
  }
  #panel h2 {
    margin: 12px 0 5px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.09em; color: #7f8794;
    border-top: 1px solid rgba(255, 255, 255, 0.12); padding-top: 8px;
  }
  #panel h2:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  #panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; }
  #panel dt { color: #8d95a0; }
  #panel dd { margin: 0; overflow-wrap: anywhere; }
  #panel button, #panel input, #panel select {
    color: #e8e8e8; background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px;
    padding: 5px; font: inherit;
  }
  #panel button { margin-top: 8px; width: 100%; cursor: pointer; }
  #panel button:hover { background: rgba(255, 255, 255, 0.18); }
  #panel button:active { background: rgba(255, 255, 255, 0.26); }
  #source { width: 100%; box-sizing: border-box; }
  #source option { background: #1d2026; color: #e8e8e8; }
  #connect {
    font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #e8e8e8; background: #1d2026; width: 420px;
    border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 6px; padding: 14px 16px;
  }
  #connect::backdrop { background: rgba(0, 0, 0, 0.45); }
  #connect h3 {
    margin: 0 0 10px; font-size: 10px; font-weight: 600; color: #7f8794;
    text-transform: uppercase; letter-spacing: 0.09em;
  }
  #connect button, #connect input, #connect select {
    color: #e8e8e8; background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px;
    padding: 5px; font: inherit;
  }
  #connect select option { background: #1d2026; }
  #connect-url { width: 100%; box-sizing: border-box; }
  #connect .hint { color: #8d95a0; margin: 6px 0 0; }
  #connect .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #connect .actions button { min-width: 84px; cursor: pointer; }
  #connect-error { color: #ff8b8b; margin-top: 8px; display: none; }
  .controls {
    display: grid; grid-template-columns: auto 1fr auto 1fr;
    gap: 4px 6px; align-items: center; margin-top: 6px;
  }
  .controls label { color: #8d95a0; }
  .controls select, .controls input { width: 100%; box-sizing: border-box; }
  .swatch {
    display: inline-block; width: 9px; height: 9px; margin-right: 6px;
    border-radius: 2px; vertical-align: baseline;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
  }
  .num { font-variant-numeric: tabular-nums; }
  #error { color: #ff8b8b; margin-top: 8px; display: none; }
  #note { color: #c2a74e; margin-top: 6px; display: none; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<dialog id="connect">
  <form id="connect-form" method="dialog">
    <h3>Connect to URL</h3>
    <input id="connect-url" spellcheck="false" autocomplete="off"
           placeholder="https://host/tileset  or  https://host/{z}/{x}/{y}.png">
    <p class="hint">A tileset directory holding metadata.json, or a {z}/{x}/{y}
      template. A template says nothing about itself, so scheme and tile size
      come from here and zooms are assumed.</p>
    <div class="controls">
      <label for="scheme">scheme</label>
      <select id="scheme">
        <option value="mercator">mercator</option>
        <option value="geographic">geographic</option>
      </select>
      <label for="tilesize">px</label>
      <input id="tilesize" type="number" min="32" max="2048" step="1" value="256">
    </div>
    <div id="connect-error"></div>
    <div class="actions">
      <button type="button" id="connect-cancel">Cancel</button>
      <button type="submit" id="connect-go">Connect</button>
    </div>
  </form>
</dialog>
<div id="panel">
  <h2>Source</h2>
  <select id="source" aria-label="tileset"></select>
  <div id="note"></div>
  <div id="error"></div>

  <h2>Tileset</h2>
  <dl id="facts"></dl>
  <button id="home">Fly to extent</button>

  <h2>On screen</h2>
  <dl id="visible"></dl>
  <button id="grid">Show tile grid</button>

  <h2>Rendering</h2>
  <div class="controls">
    <label for="sse">max SSE</label>
    <input id="sse" type="number" min="0.25" max="8" step="0.25" value="2">
    <label for="renderscale">scale</label>
    <input id="renderscale" type="number" min="0.5" max="3" step="0.25" value="1">
    <label for="magfilter">magnify</label>
    <select id="magfilter">
      <option value="linear">linear</option>
      <option value="nearest">nearest</option>
    </select>
    <label for="msaa">MSAA</label>
    <select id="msaa">
      <option value="1" selected>none</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
      <option value="8">8x</option>
    </select>
  </div>
  <h2>Downloaded</h2>
  <dl id="traffic"></dl>
  <button id="reset">Reset counters &amp; cache</button>
</div>
<script>
const METADATA = __METADATA__;
const INITIAL_SOURCE = __SOURCE__;

// -- tile grid colouring -------------------------------------------------
// Deep blue at z0 through to almost-red at the tileset's maximum zoom, computed
// from level/maxzoom so it re-scales for whatever source is loaded.
//
// The hue takes the LONG way round -- down through cyan, green and yellow -- so
// the ramp sweeps the whole spectrum between the two ends instead of blending
// them through purple. That is the point: the short way spans 130 degrees, the
// long way 225, so each level's step is nearly twice as wide and neighbouring
// levels are correspondingly easier to tell apart. Adjacent levels are exactly
// what Cesium renders together, so that is the separation that matters.
//
// The steps are taken in OKLCH, not HSL, because HSL lightness is not
// perceptual: at a fixed HSL lightness the greens come out far brighter than
// the blues, so the middle of the ramp crowds together. Measured on the worst
// adjacent pair (normal-vision deltaE, higher is better): 4.6 going the short
// way through purple, 3.0 for this spectral route in HSL, 5.7 for the same
// route in OKLCH. Canvas parses oklch() directly, so no conversion is needed.
//
// Tweak these numbers to retune the ramp; nothing else depends on them.
// A bare {z}/{x}/{y} template declares nothing about itself, so these stand in.
// A tileset directory carries its real range in metadata.json and ignores them.
const TEMPLATE_MIN_ZOOM = 0;
const TEMPLATE_MAX_ZOOM = 18;

const GRID_HUE_START = 264;   // deep blue
const GRID_HUE_END = 29;      // almost red
const GRID_LIGHT_START = 0.55;  // blue end kept darker, so it reads as deep
const GRID_LIGHT_END = 0.63;
const GRID_CHROMA = 0.17;
const GRID_ALPHA = 0.5;

function gridColor(level, maxzoom, alpha) {
  const span = Math.max(1, maxzoom);
  const f = Math.min(1, Math.max(0, level / span));
  const hue = GRID_HUE_START + (GRID_HUE_END - GRID_HUE_START) * f;
  const light = GRID_LIGHT_START + (GRID_LIGHT_END - GRID_LIGHT_START) * f;
  const base = light.toFixed(3) + " " + GRID_CHROMA + " " + hue.toFixed(1);
  return "oklch(" + base + (alpha === undefined ? "" : " / " + alpha) + ")";
}

// The imagery rectangle must be the *unsnapped* data extent, never the
// tile-snapped `bounds`. Cesium's _createTileImagerySkeletons intersects an
// imagery tile against this rectangle, and when an edge coincides exactly with
// a tile boundary that intersection comes back undefined, which then blows up
// inside rectangleToNativeRectangle ("can't access property west"). Measured:
// tile-snapped edges produce ~60 such calls while panning the border, the data
// extent produces none.
function extentOf(meta) {
  return meta.data_bounds || meta.bounds || [-180, -85, 180, 85];
}

// An extent that crosses the antimeridian arrives as west > east. The camera
// and Rectangle.contains understand that, but UrlTemplateImageryProvider does
// not: it intersects the rectangle with the tiling scheme's and keeps only the
// part east of `west` up to 180, so a mosaic running from Guam to Halifax loaded
// nothing but the Guam slice. The imagery therefore gets the full longitude
// band instead. Its edges sit a hair inside +/-180 so they never coincide with
// a tile boundary (see above); 1e-5 degrees is ~1 m, a thirtieth of a z12 pixel.
function imageryExtentOf(meta) {
  const e = extentOf(meta);
  return e[0] > e[2] ? [-180 + 1e-5, e[1], 180 - 1e-5, e[3]] : e;
}

function bytes(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(2) + " MB";
}

function rows(dl, pairs) {
  dl.textContent = "";
  for (const [k, v, swatch] of pairs) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.className = "num";
    if (swatch) {
      const chip = document.createElement("span");
      chip.className = "swatch";
      chip.style.background = swatch;
      dd.appendChild(chip);
    }
    dd.appendChild(document.createTextNode(v));
    dl.append(dt, dd);
  }
}

function facts(meta) {
  const fallbackCrs = meta.scheme === "geographic" ? "EPSG:4326" : "EPSG:3857";
  const out = [
    ["name", meta.name || "(unnamed)"],
    ["scheme", meta.scheme + " / " + (meta.crs || fallbackCrs)],
    ["zooms", meta.minzoom + "-" + meta.maxzoom],
  ];
  if (meta.format) out.push(["format", meta.format + " (" + (meta.convention || "xyz") + ")"]);
  if (meta.tiles) out.push(["tiles", meta.tiles.toLocaleString()]);
  if (meta.bytes) out.push(["size", (meta.bytes / 1e6).toFixed(1) + " MB"]);
  return out;
}

// -- download accounting ------------------------------------------------
// Resource Timing gives the real transfer size per tile.
//
// Telling a real download from a cache hit needs care, because browsers do not
// agree on how to report one. A cache hit can arrive as transferSize 0, or as a
// fixed ~300-byte header placeholder alongside a full encodedBodySize and a 200
// status. The reliable, browser-independent test is whether the body could have
// crossed the wire at all: if transferSize is smaller than encodedBodySize, it
// did not. That covers 304 revalidations and plain cache hits alike.
//
// A cross-origin tile server that omits Timing-Allow-Origin reports all three
// sizes as zero. Those are counted separately and the byte totals marked
// unavailable, rather than silently reported as zero.
//
// Cesium also keeps its own in-memory imagery cache, and a tile it serves from
// there makes no request at all, so it appears in none of these counters.
function makeTracker() {
  const state = {
    pattern: /(\d+)\/(\d+)\/(\d+)(?:\.[A-Za-z0-9]+)?(?:\?|$)/,
    prefix: "",
    downloaded: 0, cached: 0, opaque: 0,
    network: 0, payload: 0, imagery: 0,
    last: "-", byLevel: new Map(), since: Date.now(),
  };

  function consume(entry) {
    if (state.prefix && entry.name.indexOf(state.prefix) === -1) return;
    const hit = state.pattern.exec(entry.name);
    if (!hit) return;
    const z = hit[1], x = hit[2], y = hit[3];
    state.last = z + "/" + x + "/" + y;

    const body = entry.encodedBodySize || 0;
    const wire = entry.transferSize || 0;
    const decoded = entry.decodedBodySize || 0;
    state.imagery += decoded;
    state.network += wire;

    if (body === 0 && wire === 0 && decoded === 0) {
      state.opaque++;                      // cross-origin, sizes withheld
    } else if (body > 0 && wire < body) {
      state.cached++;                      // body came from cache, not the wire
    } else {
      state.downloaded++;
      state.payload += body;
    }
    state.byLevel.set(+z, (state.byLevel.get(+z) || 0) + 1);
  }

  performance.getEntriesByType("resource").forEach(consume);
  try {
    new PerformanceObserver((list) => list.getEntries().forEach(consume))
      .observe({ type: "resource", buffered: false });
  } catch (err) {
    /* Resource Timing unavailable; the panel will just show zeros. */
  }

  state.reset = function () {
    state.downloaded = 0; state.cached = 0; state.opaque = 0;
    state.network = 0; state.payload = 0; state.imagery = 0;
    state.last = "-"; state.byLevel.clear(); state.since = Date.now();
    try { performance.clearResourceTimings(); } catch (err) { /* not fatal */ }
  };
  return state;
}

// -- what the globe is actually drawing ---------------------------------
// Walks Cesium's render list. These are private fields, so everything is
// guarded: a Cesium upgrade that renames them should degrade to "unavailable"
// rather than break the page.
function visibleTiles(viewer, layer) {
  try {
    const rendered = viewer.scene.globe._surface._tilesToRender;
    if (!rendered) return null;
    const seen = new Set();
    const byLevel = new Map();
    let loading = 0;
    for (const terrainTile of rendered) {
      const imagery = terrainTile.data && terrainTile.data.imagery;
      if (!imagery) continue;
      for (const slot of imagery) {
        const tile = slot.readyImagery || slot.loadingImagery;
        if (!tile || tile.level === undefined) continue;
        if (layer && tile.imageryLayer !== layer) continue;
        if (!slot.readyImagery) loading++;
        const key = tile.level + "/" + tile.x + "/" + tile.y;
        if (seen.has(key)) continue;
        seen.add(key);
        let box = byLevel.get(tile.level);
        if (!box) {
          box = { n: 0, x0: tile.x, x1: tile.x, y0: tile.y, y1: tile.y };
          byLevel.set(tile.level, box);
        }
        box.n++;
        box.x0 = Math.min(box.x0, tile.x); box.x1 = Math.max(box.x1, tile.x);
        box.y0 = Math.min(box.y0, tile.y); box.y1 = Math.max(box.y1, tile.y);
      }
    }
    return { total: seen.size, loading: loading, byLevel: byLevel };
  } catch (err) {
    return null;
  }
}

// -- resolving whatever was typed into a tileset ------------------------
// Either a URL template containing {z}/{x}/{y}, used as given, or a directory
// expected to hold the metadata.json one of our own tilesets writes.
async function resolveSource(spec, form) {
  spec = (spec || "").trim();
  if (!spec) throw new Error("enter a directory or a {z}/{x}/{y} URL");

  if (spec.indexOf("{z}") !== -1) {
    return {
      name: spec, url_template: spec,
      scheme: form.scheme, minzoom: form.minzoom,
      maxzoom: form.maxzoom, tilesize: form.tilesize,
      templateOnly: true,
    };
  }

  const base = spec.replace(/\/+$/, "");
  const response = await fetch(base + "/metadata.json");
  if (!response.ok) {
    throw new Error("no metadata.json under " + base + " (HTTP " + response.status + ")");
  }
  const meta = await response.json();
  // Its url_template is relative to its own directory, not to this page.
  meta.url_template = base + "/" + meta.url_template;
  return meta;
}

function start(initialMeta) {
  const viewer = new Cesium.Viewer("cesiumContainer", {
    baseLayerPicker: false,
    geocoder: false,
    homeButton: false,
    navigationHelpButton: false,
    sceneModePicker: true,
    timeline: false,
    animation: false,
    infoBox: false,
    selectionIndicator: false,
    fullscreenButton: true,
    // No Ion token is used: our own tiles become the base layer below, and the
    // default ellipsoid terrain needs no network access.
    baseLayer: false,
  });
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#10131a");

  const el = (id) => document.getElementById(id);
  const tracker = makeTracker();

  let meta = initialMeta;
  let rectangle = null;        // imagery extent, safe for the provider
  let viewRectangle = null;    // true data extent, for framing the camera
  let baseLayer = null;
  let gridLayer = null;
  let bust = 0;

  const newTilingScheme = () => (meta.scheme === "geographic"
    ? new Cesium.GeographicTilingScheme()
    : new Cesium.WebMercatorTilingScheme());

  function newLayer() {
    const joiner = meta.url_template.indexOf("?") === -1 ? "?r=" : "&r=";
    const provider = new Cesium.UrlTemplateImageryProvider({
      url: meta.url_template + (bust ? joiner + bust : ""),
      tilingScheme: newTilingScheme(),
      rectangle: rectangle,
      minimumLevel: meta.minzoom,
      maximumLevel: meta.maxzoom,
      tileWidth: meta.tilesize,
      tileHeight: meta.tilesize,
      hasAlphaChannel: meta.format !== "jpeg",
      credit: new Cesium.Credit(meta.name || "tiles", false),
    });
    // A tileset described by metadata.json writes tiles only where it has
    // data, so inside its extent a 404 just means "nothing here" -- a mosaic
    // of chart sheets has ocean and gaps between them. That is not worth a
    // warning. Anything else is: other statuses, or any failure from a bare
    // template, which says nothing about where it has tiles.
    provider.errorEvent.addEventListener((err) => {
      const status = err && err.error && err.error.statusCode;
      if (status === 404 && !meta.templateOnly) return;
      note("a tile request failed - the zoom range may go deeper than this source " +
           "has, or a remote server may be refusing cross-origin requests");
    });
    return new Cesium.ImageryLayer(provider);
  }

  // The grid is generated canvases, not fetched files, so it adds nothing to
  // the traffic counters. Only the tile edge is drawn -- a dark hairline
  // underneath keeps it legible where the imagery below is pale.
  function newGridLayer() {
    const provider = new Cesium.TileCoordinatesImageryProvider({ tilingScheme: newTilingScheme() });
    provider.maximumLevel = meta.maxzoom;
    const size = meta.tilesize || 256;
    provider.requestImage = function (x, y, level) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      // A faint dark hairline under the stroke keeps a 50%-transparent border
      // visible where the imagery beneath it is pale.
      ctx.strokeStyle = "rgba(0, 0, 0, 0.22)";
      ctx.lineWidth = 5;
      ctx.strokeRect(2.5, 2.5, size - 5, size - 5);
      ctx.strokeStyle = gridColor(level, meta.maxzoom, GRID_ALPHA);
      ctx.lineWidth = 3;
      ctx.strokeRect(2.5, 2.5, size - 5, size - 5);
      return Promise.resolve(canvas);
    };
    return new Cesium.ImageryLayer(provider, { rectangle: rectangle });
  }

  function relayer() {
    const showingGrid = gridLayer !== null;
    viewer.imageryLayers.removeAll();
    baseLayer = newLayer();
    viewer.imageryLayers.add(baseLayer);
    gridLayer = showingGrid ? newGridLayer() : null;
    if (gridLayer) viewer.imageryLayers.add(gridLayer);
  }

  function cameraIsInside(rect) {
    const c = viewer.camera.positionCartographic;
    return Cesium.Rectangle.contains(rect, Cesium.Cartographic.fromRadians(c.longitude, c.latitude));
  }

  function rebuild(fly) {
    const extent = extentOf(meta);
    viewRectangle = Cesium.Rectangle.fromDegrees(extent[0], extent[1], extent[2], extent[3]);
    const imagery = imageryExtentOf(meta);
    rectangle = Cesium.Rectangle.fromDegrees(imagery[0], imagery[1], imagery[2], imagery[3]);
    relayer();
    // Count only tiles belonging to the source now loaded.
    // Resource Timing reports absolute URLs, so the filter has to be absolute
    // too. A source of "." rebases the template to "./tiles/...", which as a
    // literal prefix matches no entry at all and silently zeroes the counters.
    const stem = meta.url_template.split("{z}")[0];
    try {
      tracker.prefix = new URL(stem, document.baseURI).href;
    } catch (err) {
      tracker.prefix = stem;
    }
    window.tilesetMetadata = meta;   // kept current, not captured at startup
    rows(el("facts"), facts(meta));
    // Only the first load frames the tileset. Swapping sources deliberately
    // leaves the camera alone, so two tilesets can be compared at a fixed
    // viewpoint -- moving the camera would defeat the comparison.
    if (fly) {
      viewer.camera.setView({ destination: viewRectangle });
    } else if (!cameraIsInside(viewRectangle)) {
      note("camera is outside this tileset — use Fly to extent");
    }
    refresh();
  }

  function note(message) {
    const box = el("note");
    box.style.display = message ? "block" : "none";
    box.textContent = message || "";
  }

  function problem(message) {
    const box = el("error");
    box.style.display = message ? "block" : "none";
    box.textContent = message || "";
  }

  // Resolve and switch to a source. Throws on failure and leaves the current
  // tileset in place, so a bad pick never blanks the globe.
  async function loadSpec(spec) {
    problem(""); note("");
    const loaded = await resolveSource(spec, {
      scheme: el("scheme").value,
      minzoom: TEMPLATE_MIN_ZOOM,
      maxzoom: TEMPLATE_MAX_ZOOM,
      tilesize: Number(el("tilesize").value) || 256,
    });
    if (loaded.templateOnly) {
      note("no metadata.json: assuming z" + TEMPLATE_MIN_ZOOM + "-" +
           TEMPLATE_MAX_ZOOM + " and a whole-world extent");
    }
    meta = loaded;
    meta.source_spec = spec;
    bust = 0;
    tracker.reset();
    rebuild(false);   // keep the viewpoint, so A/B comparison is possible
  }

  // -- the source menu -------------------------------------------------
  // Local tilesets come from the server's one-level scan (/tilesets.json);
  // URLs connected this session are listed after them; a separator and
  // "Connect to URL..." close the menu. It is rebuilt rather than patched, so
  // the order is always local, connected, separator, connect.
  const CONNECT = "\u0000connect";
  let localSources = [];
  const connectedSources = [];

  function remember(spec) {
    if (!localSources.some((s) => s.path === spec) && !connectedSources.includes(spec)) {
      connectedSources.push(spec);
    }
  }

  function renderMenu() {
    const select = el("source");
    select.textContent = "";
    const add = (value, label, disabled) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      option.disabled = !!disabled;
      select.appendChild(option);
    };
    for (const s of localSources) {
      add(s.path, s.valid === false
        ? s.path + "  (unreadable metadata.json)"
        : s.name + "  \u2014  " + s.path);
    }
    for (const url of connectedSources) add(url, url);
    if (!localSources.length && !connectedSources.length) add("", "no tilesets found", true);
    add("", "\u2500".repeat(24), true);
    add(CONNECT, "Connect to URL...");
    select.value = meta.source_spec || "";
  }

  async function refreshMenu() {
    try {
      const response = await fetch("tilesets.json", { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      localSources = await response.json();
    } catch (err) {
      // Not our server, or a saved copy of the page: offer what it opened with.
      localSources = INITIAL_SOURCE ? [{ path: INITIAL_SOURCE, name: meta.name || INITIAL_SOURCE }] : [];
    }
    if (meta.source_spec) remember(meta.source_spec);
    renderMenu();
  }

  el("source").addEventListener("change", async () => {
    const picked = el("source").value;
    if (picked === CONNECT) {
      renderMenu();   // show the current source again while the dialog is up
      openConnect();
      return;
    }
    try {
      await loadSpec(picked);
    } catch (err) {
      problem(err.message);
    }
    renderMenu();
  });

  function connectError(message) {
    const box = el("connect-error");
    box.style.display = message ? "block" : "none";
    box.textContent = message || "";
  }

  function openConnect() {
    connectError("");
    el("scheme").value = meta.scheme || "mercator";
    el("tilesize").value = meta.tilesize || 256;
    el("connect").showModal();
    el("connect-url").select();
  }

  el("connect-cancel").addEventListener("click", () => el("connect").close());

  el("connect-form").addEventListener("submit", async (event) => {
    event.preventDefault();   // stay open until the source actually loads
    const url = el("connect-url").value.trim();
    if (!url) { connectError("enter a URL"); return; }
    const go = el("connect-go");
    go.disabled = true;
    go.textContent = "Connecting...";
    try {
      await loadSpec(url);
      remember(url);
      renderMenu();
      el("connect").close();
    } catch (err) {
      // fetch rejects with a bare TypeError for network and CORS failures alike.
      connectError(err.message + (err instanceof TypeError
        ? " -- unreachable, or the server does not allow cross-origin requests" : ""));
    } finally {
      go.disabled = false;
      go.textContent = "Connect";
    }
  });

  el("home").addEventListener("click", () =>
    viewer.camera.flyTo({ destination: viewRectangle, duration: 1.5 }));

  // Clearing the browser's HTTP cache is not possible from script, so reset
  // rebuilds the layer against a fresh query string instead: new URLs miss both
  // Cesium's in-memory tile cache and the browser's, and the counters then
  // measure a genuine cold load rather than replaying what is already local.
  el("reset").addEventListener("click", () => {
    bust = Date.now();
    relayer();
    tracker.reset();
    refresh();
  });

  el("grid").addEventListener("click", () => {
    if (gridLayer) {
      viewer.imageryLayers.remove(gridLayer, true);
      gridLayer = null;
    } else {
      gridLayer = newGridLayer();
      viewer.imageryLayers.add(gridLayer);
    }
    el("grid").textContent = gridLayer ? "Hide tile grid" : "Show tile grid";
    refresh();
  });

  // Rendering controls. Two Cesium defaults work against close inspection of
  // imagery: useBrowserRecommendedResolution ignores the display's pixel ratio,
  // so on a 1.5x screen the globe renders at two thirds of the panel's
  // sharpness; and magnification is LINEAR, so past the deepest zoom every tile
  // is bilinearly smeared, which looks like the tileset's fault when it is not.
  function applyRendering() {
    const scale = Number(el("renderscale").value) || 1;
    viewer.scene.globe.maximumScreenSpaceError = Number(el("sse").value) || 2;
    viewer.useBrowserRecommendedResolution = false;   // honour devicePixelRatio
    viewer.resolutionScale = scale;
    viewer.scene.msaaSamples = Number(el("msaa").value) || 1;

    const nearest = el("magfilter").value === "nearest";
    const mag = nearest ? Cesium.TextureMagnificationFilter.NEAREST
                        : Cesium.TextureMagnificationFilter.LINEAR;
    for (let i = 0; i < viewer.imageryLayers.length; i++) {
      viewer.imageryLayers.get(i).magnificationFilter = mag;
    }
    // The filter is baked into the texture at upload, so existing tiles keep
    // the old one until the surface is rebuilt.
    viewer.scene.globe._surface.invalidateAllTiles();
    refresh();
  }
  for (const id of ["sse", "renderscale", "magfilter", "msaa"]) {
    el(id).addEventListener("change", applyRendering);
  }

  function refresh() {
    const view = visibleTiles(viewer, baseLayer);
    const altitude = viewer.camera.positionCartographic.height;
    const shown = [["altitude", altitude > 9999
      ? (altitude / 1000).toFixed(0) + " km" : Math.round(altitude) + " m"]];

    if (!view) {
      shown.push(["tiles", "unavailable"]);
    } else {
      shown.push(["tiles", view.total + (view.loading ? "  (" + view.loading + " loading)" : "")]);
      const levels = [...view.byLevel.keys()].sort((a, b) => a - b);
      for (const level of levels) {
        const b = view.byLevel.get(level);
        const span = b.n + " \u00d7  x " + b.x0 + (b.x1 > b.x0 ? "-" + b.x1 : "") +
                     "  y " + b.y0 + (b.y1 > b.y0 ? "-" + b.y1 : "");
        shown.push(["z" + level, span, gridLayer ? gridColor(level, meta.maxzoom) : null]);
      }
      if (!levels.length) shown.push(["", "none in view"]);
    }
    rows(el("visible"), shown);

    const seconds = Math.max(1, (Date.now() - tracker.since) / 1000);
    const opaque = tracker.opaque > 0 && tracker.payload === 0;
    const traffic = [
      ["downloaded", (tracker.downloaded + tracker.opaque) + " tiles"],
      ["network", opaque ? "n/a (cross-origin)" : bytes(tracker.network)],
      ["avg tile", tracker.downloaded
        ? bytes(Math.round(tracker.payload / tracker.downloaded)) : "-"],
      ["from cache", tracker.cached + " tiles"],
      ["imagery seen", opaque ? "n/a" : bytes(tracker.imagery)],
      ["last tile", tracker.last],
      ["elapsed", seconds < 60 ? seconds.toFixed(0) + " s" : (seconds / 60).toFixed(1) + " min"],
    ];
    const levels = [...tracker.byLevel.keys()].sort((a, b) => a - b);
    if (levels.length) {
      traffic.push(["by level", levels.map((z) => "z" + z + ":" + tracker.byLevel.get(z)).join("  ")]);
    }
    rows(el("traffic"), traffic);


  }

  meta.source_spec = meta.source_spec || INITIAL_SOURCE || ".";
  renderMenu();
  refreshMenu();
  rebuild(true);
  setInterval(refresh, 400);

  // Exposed deliberately: makes the page inspectable from the dev console.
  window.viewer = viewer;
  window.tileTracker = tracker;
  window.loadSource = async (spec) => { await loadSpec(spec); remember(spec); renderMenu(); };
  return viewer;
}

function fail(message) {
  const box = document.getElementById("error");
  box.style.display = "block";
  box.textContent = message;
}

// Resolve the starting source the same way the Source box does, so the page
// stays correct after a re-tile and works whether it is serving one tileset or
// sitting above several. METADATA is a snapshot baked in at generation time,
// used only if that lookup fails.
(INITIAL_SOURCE
  ? resolveSource(INITIAL_SOURCE, { scheme: "mercator", minzoom: TEMPLATE_MIN_ZOOM,
                                    maxzoom: TEMPLATE_MAX_ZOOM, tilesize: 256 })
      .then((meta) => { meta.source_spec = INITIAL_SOURCE; return meta; })
  : Promise.reject(new Error("no source")))
  .catch((err) => {
    if (METADATA) return METADATA;
    throw err;
  })
  .then(start)
  .catch((err) => fail(
    "No tileset found to open. Build one, or serve a directory that holds one. (" + err.message + ")"));
</script>
</body>
</html>
