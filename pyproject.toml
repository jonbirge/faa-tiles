[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faa-tiles"
version = "0.1.0"
description = "GeoTIFF georeferencing transfer and static Cesium tile generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rasterio>=1.5,<2", "gdal>=3.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "mercantile>=1.2"]

[project.scripts]
geotransfer = "geotransfer.cli:main"
cesiumtiles = "cesiumtiles.cli:main"
cesiumtiles-serve = "cesiumtiles.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# We deliberately open files that lack georeferencing; that warning is expected.
filterwarnings = [
    "ignore::rasterio.errors.NotGeoreferencedWarning",
    "ignore:Use `@` matmul:PendingDeprecationWarning",
]
